services:
  # ---------------------------------------------
  # NestJS Application
  # ---------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edl_edoc_app
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - .env
    volumes:
      # Bind mount → ชี้ไปยังโฟลเดอร์นอกโปรเจกต์ กำหนดใน .env ด้วย UPLOAD_HOST_PATH
      - ${UPLOAD_HOST_PATH:-/opt/edl-uploads}:/app/uploads
    networks:
      - edl_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1g
        reservations:
          cpus: '0.25'
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ---------------------------------------------
  # Postgres Backup (cron inside container)
  # สำรองข้อมูลอัตโนมัติตามเวลาที่กำหนด
  # รองรับการอัปโหลดไปยัง S3 / S3-compatible storage (optional)
  # ---------------------------------------------
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: edl_edoc_backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGHOST: ${DB_HOST:-192.168.20.236}
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-edl_edoc_db}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 2 * * *}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-edl-edoc/postgres}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
    volumes:
      - backup_data:/backups
    networks:
      - edl_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'

# ---------------------------------------------
# Named Volumes
# ---------------------------------------------
volumes:
  backup_data:
    driver: local
  # uploads_data ถูกเปลี่ยนเป็น bind mount แล้ว (ดู UPLOAD_HOST_PATH ใน .env)

# ---------------------------------------------
# Networks
# ---------------------------------------------
networks:
  edl_network:
    driver: bridge

