services:
  # ─── NestJS API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: edl-edoc-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      # ── App ──────────────────────────────────────────────────────────────────
      NODE_ENV: production
      PORT: 5000

      # ── Database ─────────────────────────────────────────────────────────────
      DATABASE_URL: ${DATABASE_URL}

      # ── Authentication ───────────────────────────────────────────────────────
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}

      # ── File Upload ──────────────────────────────────────────────────────────
      # !! สำคัญ: ต้องเป็น absolute path ภายใน container ที่ตรงกับ volume ด้านล่าง
      UPLOAD_DESTINATION: /app/uploads/documents
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE:-52428800}
      UPLOAD_MAX_FILES: ${UPLOAD_MAX_FILES:-10}
      UPLOAD_ALLOWED_MIME_TYPES: ${UPLOAD_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/gif,image/webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet}

      # ── HRM API ──────────────────────────────────────────────────────────────
      HRM_LOGIN_URL: ${HRM_LOGIN_URL}
      HRM_API_URL: ${HRM_API_URL}
      HRM_API_URL_DEPARTMENT: ${HRM_API_URL_DEPARTMENT}
      HRM_DIVISION_API_URL: ${HRM_DIVISION_API_URL}
      HRM_OFFICE_API_URL: ${HRM_OFFICE_API_URL}
      HRM_USERNAME: ${HRM_USERNAME}
      HRM_PASSWORD: ${HRM_PASSWORD}

      # ── Other ────────────────────────────────────────────────────────────────
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD}

    volumes:
      # ── Persistent upload storage ─────────────────────────────────────────────
      # ซ้ายคือ host path (server), ขวาคือ path ใน container
      # ต้องตรงกับ UPLOAD_DESTINATION ด้านบน
      - edl_uploads:/app/uploads

    networks:
      - edl-network

    depends_on:
      db:
        condition: service_healthy

  # ─── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: edl-edoc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-edl_edoc_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - edl_pgdata:/var/lib/postgresql/data
    networks:
      - edl-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-edl_edoc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ─── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  edl_pgdata:
    driver: local
  edl_uploads:
    # ถ้าต้องการ bind mount ไปยัง path บน host ให้ uncomment และแก้ path
    # driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /var/www/edl-edoc/uploads
    driver: local

# ─── Networks ────────────────────────────────────────────────────────────────
networks:
  edl-network:
    driver: bridge
